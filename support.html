<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Byteable — Support</title>
  <style>
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; line-height:1.55; }
    header, main, footer { max-width: 860px; margin: 0 auto; padding: 22px 18px; }
    header { border-bottom: 1px solid #eee; }
    a { color: inherit; }
    h1 { margin: 0 0 6px; }
    .muted { color:#555; }
    .box { background:#f7f7f9; padding:14px 14px; border-radius:10px; }
    input, textarea { width:100%; padding:10px; border-radius:10px; border:1px solid #ddd; font:inherit; }
    button { padding:10px 14px; border-radius:10px; border:1px solid #ddd; font-weight:600; cursor:pointer; }
  </style>
</head>
<body>
  <header>
    <a href="index.html">← Back to Byteable</a>
    <h1>Support</h1>
    <div class="muted">Questions, feedback, or bug reports.</div>
  </header>

  <main>
    <div class="box">
      <p><strong>Email:</strong> <a href="mailto:byteable.app@gmail.com">byteable.app@gmail.com</a></p>
      <p class="muted">Tip: include your device model, OS version, and what you were doing when the issue happened.</p>
    </div>

    <h2>Quick message (optional)</h2>
    <p class="muted">This form uses your email client (no backend required).</p>
    <form onsubmit="return sendMail(event)">
      <label>Your email (optional)</label>
      <input id="email" type="email" placeholder="you@example.com" />

      <div style="height:12px;"></div>

      <label>Message</label>
      <textarea id="msg" rows="6" placeholder="What can we help with?"></textarea>

      <div style="height:12px;"></div>

      <button type="submit">Open email</button>
    </form>
  </main>

  <footer class="muted">
    <a href="privacy.html">Privacy</a> · <a href="terms.html">Terms</a>
  </footer>

  <script>
    function sendMail(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const msg = document.getElementById('msg').value.trim();
      const subject = encodeURIComponent("Byteable Support");
      const body = encodeURIComponent((email ? `From: ${email}\n\n` : "") + msg);
      window.location.href = `mailto:byteable.app@gmail.com?subject=${subject}&body=${body}`;
      return false;
    }
  </script>
</body>
</html>
